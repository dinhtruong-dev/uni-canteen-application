<!doctype html>
<html lang="vi">
  <head>
    <script>
      (function() {
        try {
          var proto = window;
          var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
          while (!desc && proto) {
            proto = Object.getPrototypeOf(proto);
            if (proto) desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
          }
          if (desc && desc.get && !desc.set) {
            var activeFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(newFetch) {
                activeFetch = typeof newFetch === 'function' ? newFetch : activeFetch;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {
          // Graceful ignore
        }
      })();
    </script>
